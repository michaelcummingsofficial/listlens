name: ListLens
options:
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true
packages:
  ListLens:
    path: .
targets:
  ListLens:
    type: application
    platform: iOS
    sources:
      - App/ListLens
    dependencies:
      - package: ListLens
        product: ListLensCore
      - package: ListLens
        product: ListLensGlasses
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fun.displaylist.listlens
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
        # Developer Mode needs neither; set both from Wearables Developer Center for other release channels.
        META_APP_ID: ""
        CLIENT_TOKEN: ""
    entitlements:
      path: App/ListLens/ListLens.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
        com.apple.developer.networking.HotspotConfiguration: true
        com.apple.developer.networking.wifi-info: true
    info:
      path: App/ListLens/Info.plist
      properties:
        CFBundleDisplayName: ListLens
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - listlens
        MWDAT:
          AppLinkURLScheme: listlens://
          MetaAppID: $(META_APP_ID)
          ClientToken: $(CLIENT_TOKEN)
          TeamID: $(DEVELOPMENT_TEAM)
        UIBackgroundModes:
          - bluetooth-central
          - bluetooth-peripheral
          - external-accessory
          - audio
        NSBluetoothAlwaysUsageDescription: ListLens connects to your Meta glasses over Bluetooth.
        NSBluetoothPeripheralUsageDescription: ListLens connects to your Meta glasses over Bluetooth.
        NSLocalNetworkUsageDescription: ListLens joins your glasses' Wi-Fi to receive the camera feed.
        NSBonjourServices:
          - _bonjour._tcp
        NSMicrophoneUsageDescription: ListLens keeps your glasses' microphone open while you shop, so it keeps working with your phone in your pocket.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
